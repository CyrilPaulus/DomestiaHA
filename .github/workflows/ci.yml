name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write # test report

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --results-directory TestResults
          --report-xunit-trx --report-xunit-trx-filename tests.trx
          --report-xunit-html --report-xunit-html-filename tests.html

      - name: Test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Test results
          path: TestResults/tests.trx
          reporter: dotnet-trx

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: TestResults
